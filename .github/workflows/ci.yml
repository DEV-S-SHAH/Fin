name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests + lint + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest tests/ -q
      - name: Lint (ruff)
        run: ruff check sandbox_engine/ tests/
      - name: Typecheck (mypy)
        run: mypy sandbox_engine/

  frontend:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [python, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t fingraph:${{ github.sha }} .
      - name: Smoke test
        run: |
          docker run -d --name test -p 9100:9100 fingraph:${{ github.sha }}
          sleep 3
          curl -fsS http://localhost:9100/ | grep -q "FinGraph"
          curl -fsS http://localhost:9100/app | grep -q "FinGraph"
          docker stop test && docker rm test
