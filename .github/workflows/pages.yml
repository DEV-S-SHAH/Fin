name: Pages

# Publishes docs/ (the review-deck viewer) to GitHub Pages.
#
# Works with Source = "GitHub Actions". If Pages is not enabled yet, or is set to
# "Deploy from a branch", this workflow exits green with an instruction instead of
# failing -- a branch-based Pages setup keeps serving docs/ on its own.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check Pages configuration
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -s -o pages.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" || true)
          echo "GET /repos/$GITHUB_REPOSITORY/pages -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::notice title=GitHub Pages is not enabled::Enable it once at Settings -> Pages -> Source: GitHub Actions (or Deploy from a branch, main /docs). Then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          build_type=$(python3 -c "import json;print(json.load(open('pages.json')).get('build_type') or '')")
          echo "build_type=$build_type"
          if [ "$build_type" != "workflow" ]; then
            echo "::notice title=Pages is served from a branch::Settings -> Pages -> Source is '$build_type', which already publishes docs/. Nothing to do here."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.enabled == 'true'

      - uses: actions/configure-pages@v5
        if: steps.preflight.outputs.enabled == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.preflight.outputs.enabled == 'true'
        with:
          path: docs

      - name: Deploy
        id: deploy
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
