<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="FinGraph — GraphRAG Execution Animation">
<title>FinGraph — GraphRAG Execution</title>

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/animation/styles.css">

<script>
  try {
    var saved = localStorage.getItem("ui2.theme");
    if (saved === "light" || saved === "dark") {
      document.documentElement.dataset.theme = saved;
    } else if (window.matchMedia("(prefers-color-scheme: light)").matches) {
      document.documentElement.dataset.theme = "light";
    }
  } catch (e) { /* private mode: the default dark theme stands */ }
</script>
</head>

<body>
<div class="animation-page" id="animation-page">
  <div id="animation-root"></div>
</div>

<script type="module" src="/animation/app.js"></script>
</body>
</html>
